<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - RMM Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .msg { color: #d9534f; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reset Admin Password</h2>
        {% if msg %}
            <p class="msg">{{ msg }}</p>
        {% endif %}

        {% if step == 1 %}
            <form method="POST">
                <input type="hidden" name="action" value="send_otp">
                <p>Click below to send a 6-digit OTP to the registered admin email address.</p>
                <button type="submit">Send OTP to Email</button>
            </form>
        {% elif step == 2 %}
            <form method="POST">
                <input type="hidden" name="action" value="verify_reset">
                <input type="text" name="otp" placeholder="Enter 6-Digit OTP" required>
                <input type="password" name="new_password" placeholder="Enter New Password" required>
                <button type="submit">Verify OTP & Reset Password</button>
            </form>
        {% endif %}
        <br><br>
        <a href="/login" style="color: #6c757d; text-decoration: none; font-size: 14px;">Back to Login</a>
    </div>
</body>
</html>
