<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - RMM Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 340px; text-align: center; }
        h2 { margin-bottom: 20px; color: #333; }
        p { font-size: 14px; color: #666; margin-bottom: 20px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .alert { color: #d9534f; margin-bottom: 15px; font-size: 14px; }
        a { color: #007bff; text-decoration: none; font-size: 13px; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Reset Admin Password</h2>

    {% if msg %}
        <div class="alert">{{ msg }}</div>
    {% endif %}

    {% if step == 1 or not step %}
        <p>Click below to send a 6-digit OTP to your registered phone number (+917055361662).</p>
        <form method="POST" action="/forgot-password">
            <input type="hidden" name="action" value="send_otp">
            <button type="submit">Send OTP via SMS</button>
        </form>
    {% elif step == 2 %}
        <p>Enter the OTP sent to your phone and your new password.</p>
        <form method="POST" action="/forgot-password">
            <input type="hidden" name="action" value="verify_reset">
            <input type="text" name="otp" placeholder="Enter 6-digit OTP" required autocomplete="off">
            <input type="password" name="new_password" placeholder="Enter New Password" required>
            <button type="submit" style="background-color: #28a745;">Verify OTP & Reset Password</button>
        </form>
    {% endif %}

    <a href="/login">Back to Login</a>
</div>

</body>
</html>
