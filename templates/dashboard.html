<!-- Reset Password via Gmail Modal -->
<div class="modal fade" id="resetModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow">
      <div class="modal-header bg-warning text-dark">
        <h5 class="modal-title font-weight-bold">🔐 Reset Password via Gmail OTP</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted mb-3">OTP will be sent directly to registered email: <strong>Bhandaribharat216@gmail.com</strong></p>
        
        <button type="button" class="btn btn-primary w-100 mb-3" onclick="sendGmailOTP()" id="btnSendOtp">
          📩 Send Gmail OTP
        </button>

        <div class="mb-3">
          <label class="form-label font-weight-bold">Enter 6-Digit OTP</label>
          <input type="text" id="otpInput" class="form-control" placeholder="Enter OTP received on Gmail">
        </div>

        <div class="mb-3">
          <label class="form-label font-weight-bold">New Password</label>
          <input type="password" id="newPasswordInput" class="form-control" placeholder="Enter new password">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-success w-100" onclick="confirmPasswordChange()">Confirm & Update Password</button>
      </div>
    </div>
  </div>
</div>

<script>
function sendGmailOTP() {
    const btn = document.getElementById('btnSendOtp');
    btn.disabled = true;
    btn.innerText = "Sending OTP...";

    fetch('/send-otp', { 
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        btn.disabled = false;
        btn.innerText = "📩 Resend Gmail OTP";
    })
    .catch(err => {
        alert("Error sending OTP");
        btn.disabled = false;
        btn.innerText = "📩 Send Gmail OTP";
    });
}

function confirmPasswordChange() {
    const otp = document.getElementById('otpInput').value;
    const newPassword = document.getElementById('newPasswordInput').value;

    if(!otp || !newPassword) {
        alert("Please enter both OTP and New Password!");
        return;
    }

    fetch('/verify-otp-reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otp: otp, new_password: newPassword })
    })
    .then(res => res.json())
    .then(data => {
        if(data.status === 'success') {
            alert("Password updated successfully!");
            location.reload();
        } else {
            alert(data.message);
        }
    });
}
</script>
