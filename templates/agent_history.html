<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PC History - {{ hostname }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #007bff; color: white; }
        .search-box { margin-bottom: 20px; display: flex; gap: 10px; }
        input[type="text"] { padding: 8px; width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; text-decoration: none; cursor: pointer; }
        .btn-del { background: #dc3545; padding: 4px 8px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Window / URL History for: {{ hostname }}</h2>
            <a href="/" class="btn" style="background: #6c757d;">Back to Dashboard</a>
        </div>

        <form method="GET" class="search-box">
            <input type="text" name="q" value="{{ search_query }}" placeholder="Search by keyword (e.g. youtube)...">
            <button type="submit" class="btn">Search</button>
            {% if search_query %}
                <a href="/agent/{{ hostname }}" class="btn" style="background: #6c757d;">Clear Filter</a>
            {% endif %}
        </form>

        <table>
            <tr>
                <th>Timestamp</th>
                <th>Active Window Title / URL</th>
                <th>Action</th>
            </tr>
            {% for row in history %}
            <tr>
                <td>{{ row.timestamp }}</td>
                <td>{{ row.url }}</td>
                <td>
                    <form action="/api/history/delete" method="POST" style="margin:0;">
                        <input type="hidden" name="rowid" value="{{ row.rowid }}">
                        <input type="hidden" name="hostname" value="{{ hostname }}">
                        <button type="submit" class="btn btn-del">Delete</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3">No history records found.</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
